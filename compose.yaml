services:
  realm:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "true"
      REALM_CAPACITY: ${REALM_CAPACITY:-16}
      GUEST_REGISTRATIONS_PER_MINUTE: ${GUEST_REGISTRATIONS_PER_MINUTE:-5}
      SAVE_INTERVAL_MS: "1000"
      XAM_ENABLED: "true"
    volumes:
      - realm-data:/data
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 2
    networks:
      - realm
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      EMAIL: ${EMAIL:?Set EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      realm:
        condition: service_healthy
    networks:
      - realm
volumes:
  realm-data:
  caddy-data:
  caddy-config:
networks:
  realm:
