<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wayfarer • The Crossing Atlas</title>
<style>*{box-sizing:border-box}body{margin:0;background:#142923;color:#f0e6ce;font:15px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:18px;left:22px;pointer-events:none}h1{font:26px Georgia;margin:5px 0}small{letter-spacing:3px;color:#a3c8b4}p{margin:6px 0;color:#bdd0c0}aside{position:fixed;right:18px;top:18px;background:#142923df;padding:12px;border:1px solid #74816a;border-radius:10px}#map{width:155px;height:98px}footer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:20px;right:20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{background:#203f34;color:#f0e6ce;border:1px solid #8e9c77;border-radius:6px;padding:12px;font:inherit;min-height:44px}#status{background:#142923de;padding:10px;border-radius:6px;max-width:460px}#help{position:fixed;bottom:90px;left:22px;font-size:12px;color:#cfdecf;pointer-events:none}@media(max-width:550px){h1{font-size:20px}header{left:12px;top:12px}aside{top:85px;right:10px}#map{width:110px;height:70px}footer{left:10px;right:10px}#status{font-size:12px}#help{display:none}}</style>
<canvas id="world" aria-label="Interactive isometric crossing. Use arrow keys or tap a walkable surface."></canvas>
<header><small>WAYFARER / V0.7.9 ABC</small><h1>The Crossing Atlas</h1><p id="place">Willowglass Causeway</p></header>
<aside><canvas id="map" width="310" height="196" aria-label="Crossing minimap"></canvas><small>LOCAL SIMULATION</small></aside>
<div id="health" role="status" style="position:fixed;top:150px;left:12px;max-width:210px;font-size:11px;background:#142923dd;padding:6px;border-radius:4px;pointer-events:none"></div>
<div id="help">Tap terrain to travel • Arrow keys to walk • Gold marks your destination</div>
<footer><label style="color:#eee8ce">Appearance <select id="appearance" aria-label="Local character appearance"><option value="adventurer">Adventurer</option><option value="elder">Lantern elder</option><option value="traveler">Traveler</option><option value="villager">Villager</option><option value="vector">Articulated figure</option></select></label><a href="/preview/atlas.html" style="color:#fff0b8">World atlas</a><select id="style" aria-label="Crossing"><option value="willowglass">Willowglass</option><option value="saffron">Saffron</option><option value="mothlight">Mothlight</option></select><button id="cross">Cross bridge</button><button id="reset">Return</button><button id="pause" aria-pressed="false">Pause</button><span id="status" role="status">Preparing the path…</span></footer>
<script type="module" src="/dist/preview-client.js"></script></html>
