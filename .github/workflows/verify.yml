name: Verify v1.0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s python
      - run: python3 python/validate_assets.py
      - run: docker build --tag wayfarer:1.0.0 .
