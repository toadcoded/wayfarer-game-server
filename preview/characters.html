<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wayfarer · Character Studio</title><style>body{margin:0;background:#111524;color:#eadcbb;font:14px system-ui}#studio-canvas{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none}aside{position:fixed;left:12px;top:12px;width:240px;background:#111827ed;border:1px solid #a28e66;padding:12px;max-height:85dvh;overflow:auto}h1{font:24px Georgia;margin:0 0 8px}label{display:block;margin:8px 0}select,button{color:#eedeba;background:#1d2942;border:1px solid #978766;min-height:40px;padding:6px;max-width:100%}label select{display:block;width:100%}a{color:#c5d8ff}p{font-size:12px;line-height:1.5}@media(max-width:650px){aside{width:180px;max-height:42dvh;font-size:12px}h1{font-size:18px}}</style><canvas id="studio-canvas" aria-label="Interactive 3D character inspection"></canvas><aside><h1>Character Studio</h1><p>Drag to orbit, scroll/pinch to zoom. Appearance choices are a local visual preview; shared characters use their roster presets.</p><a href="/">Return to realm</a><label>Character<select id="skin"><option value="seraphine">Seraphine</option><option value="adventurer">Adventurer</option><option value="elder">Lantern elder</option><option value="traveler">Traveler</option><option value="villager">Villager</option><option value="vector">Articulated figure</option></select></label><label>Skin tone<select id="skinTone"></select></label><label>Hair color<select id="hairColor"></select></label><label>Eye color<select id="eyeColor"></select></label><label>Hair<select id="hairStyle"><option>cropped</option><option>swept</option><option>long</option></select></label><label>Facial hair<select id="facialHair"><option>none</option><option>stubble</option><option>beard</option></select></label><label>Makeup<select id="makeup"><option>none</option><option>natural</option><option>moonlit</option></select></label><label>Build<select id="build"><option>lean</option><option>balanced</option><option>strong</option></select></label><label>Pose<select id="pose"><option>idle</option><option>walk</option><option>jog</option><option>run</option><option>wave</option><option>chop</option><option>sneeze</option><option>play</option></select></label><label><input id="studio-pause" type="checkbox">Pause motion</label><button id="face-view">Face close-up</button><button id="body-view">Whole body</button><p id="studio-status" role="status">Opening 3D studio…</p></aside><script type="module" src="/preview/character-studio.bundle.js"></script></html>
